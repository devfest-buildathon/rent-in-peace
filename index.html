<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/logo-icon.png" />
    <link rel="apple-touch-icon" href="/assets/logo-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#144C2E" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Rent in Peace" />
    <meta name="description" content="AI-assisted residential lease drafting and rental ledger for Philippine boarding houses and bedspaces." />
    <title>Rent in Peace — Smart Rental Architecture</title>
    
    <!-- Google Fonts: Plus Jakarta Sans / Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'system-ui', '-apple-system', 'sans-serif'],
            },
            colors: {
              brand: {
                50: '#ecfdf5',
                100: '#d2e3d8',
                200: '#a7f3d0',
                300: '#6ee7b7',
                400: '#449567',
                500: '#2e7d4c',
                600: '#1d633c',
                700: '#185433',
                800: '#144c2e',
                900: '#0f3822',
                950: '#0a2517',
              },
              primary: {
                DEFAULT: '#144c2e',
                hover: '#0f3822',
                light: '#ecfdf5',
              },
              secondary: {
                DEFAULT: '#449567',
                hover: '#377b54',
                light: '#f0fdf4',
              },
              accent: {
                DEFAULT: '#f1ae17',
                hover: '#d99b0f',
                light: '#fef3c7',
              },
              canvas: '#e4efe9',
              gold: {
                400: '#f5be38',
                500: '#f1ae17',
                600: '#d99b0f',
              }
            },
            boxShadow: {
              'ios-card': '0 10px 30px -5px rgba(20, 76, 46, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.02)',
              'ios-float': '0 20px 35px -8px rgba(20, 76, 46, 0.16), 0 10px 15px -3px rgba(0, 0, 0, 0.05)',
              'ios-glow': '0 10px 25px -3px rgba(20, 76, 46, 0.22)',
              'ios-sheet': '0 -10px 30px rgba(0, 0, 0, 0.04)',
            }
          }
        }
      }
    </script>
    <style>
      :root {
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
      }
      body {
        overscroll-behavior-y: none;
        -webkit-tap-highlight-color: transparent;
      }
      /* Custom iOS-like subtle scrollbars */
      .scrollbar-none::-webkit-scrollbar {
        display: none;
      }
      .scrollbar-none {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      @media print {
        @page {
          size: A4 portrait;
          margin: 8mm 14mm 8mm 14mm;
        }
        html, body {
          background: #ffffff !important;
          background-color: #ffffff !important;
          color: #000000 !important;
          padding: 0 !important;
          margin: 0 !important;
          height: auto !important;
          min-height: 0 !important;
          overflow: visible !important;
        }
        #root, #root > div, .app-shell-root {
          background: #ffffff !important;
          background-color: #ffffff !important;
          color: #000000 !important;
          padding: 0 !important;
          margin: 0 !important;
          height: auto !important;
          min-height: 0 !important;
          display: block !important;
          overflow: visible !important;
          box-shadow: none !important;
          border: none !important;
        }
        .no-print {
          display: none !important;
        }
        .print-contract-root {
          display: block !important;
          width: 100% !important;
          margin: 0 !important;
          padding: 0 !important;
          background: #ffffff !important;
          color: #000000 !important;
        }
      }
    </style>
  </head>
  <body class="bg-[#E4EFE9] text-slate-800 antialiased font-sans selection:bg-emerald-200 selection:text-emerald-900">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
